<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acessar conta — EcoFila</title>
  <link rel="icon" href="/assets/head.png" type="image/png">
  <link rel="stylesheet" href="/login/styles.css">
</head>
<body>
  <main class="login-card">
    <a class="brand" href="/" aria-label="Voltar ao EcoFila"><img src="/assets/logo.png" alt="EcoFila"></a>
    <h1>Acesse sua conta</h1>
    <p class="intro">Entre para registrar e acompanhar suas denúncias. Para criar uma conta, informe seu nome e escolha “Criar conta”.</p>
    <form id="account-form">
      <label>Nome <span>(necessário para cadastro)</span><input name="name" autocomplete="name" maxlength="100"></label>
      <label>E-mail<input name="email" type="email" required maxlength="190" autocomplete="email"></label>
      <label>Senha<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
      <p class="hint">Novas senhas precisam ter pelo menos 10 caracteres.</p>
      <p id="account-error" role="alert" class="error"></p>
      <div class="actions"><button type="submit" value="login">Entrar</button><button type="submit" value="register" class="secondary">Criar conta</button></div>
    </form>
    <a class="back" href="/">Voltar ao EcoFila</a>
  </main>
  <script src="/login/script.js"></script>
</body>
</html>
